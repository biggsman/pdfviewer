<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PDF Viewer</title>
    <style>
      :root {
        --primary: #00b894;
        --bg: #f4f4f4;
        --text: #333;
        --header: #1a1a1a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        background: var(--header);
        padding: 0.4rem 1rem;
        flex-shrink: 0;
      }

      #uploadBtn {
        background: var(--primary);
        border: none;
        padding: 0.35rem 1.2rem;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s;
      }

      #uploadBtn:hover {
        background: #019170;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0.5rem;
        overflow: hidden;
      }

      #viewer {
        flex: 1;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
      }
    </style>
  </head>

  <body>
    <header>
      <button id="uploadBtn">열기</button>
    </header>

    <main>
      <iframe id="viewer" style="display: none"></iframe>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
