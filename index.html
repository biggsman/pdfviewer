<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>PDF Viewer</title>
    <style>
      :root {
        --primary: #00b894;
        --bg: #f4f4f4;
        --text: #333;
        --header: #1a1a1a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        align-items: center;
        background: var(--header);
        gap: 0.5rem;
        padding: 0.4rem 1rem;
        flex-shrink: 0;
      }

      #uploadBtn {
        background: var(--primary);
        border: none;
        padding: 0.35rem 1.2rem;
        border-radius: 6px;
        color: white;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s;
      }

      #uploadBtn:hover {
        background: #019170;
      }

      .ghost {
        background: transparent;
        border: 1px solid var(--primary);
        padding: 0.35rem 1.2rem;
        border-radius: 6px;
        color: var(--primary);
        cursor: pointer;
        font-weight: 500;
        transition: background 0.3s, color 0.3s;
      }

      .ghost:hover:not(:disabled) {
        background: var(--primary);
        color: white;
      }

      .ghost:disabled {
        border-color: #555;
        color: #777;
        cursor: default;
      }

      body.editing header button {
        visibility: hidden;
      }

      main {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0.5rem;
        overflow: hidden;
      }

      body.dragging main {
        outline: 3px dashed var(--primary);
        outline-offset: -6px;
      }

      #viewer {
        flex: 1;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
      }

      #editor {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      #editor[hidden] {
        display: none;
      }

      .editor-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.75rem;
        background: white;
        border-bottom: 1px solid #ddd;
      }

      .editor-toolbar button {
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 0.3rem 0.8rem;
        font: inherit;
        font-size: 0.9rem;
        color: var(--text);
        cursor: pointer;
      }

      .editor-toolbar button:hover:not(:disabled) {
        border-color: var(--primary);
        color: #019170;
      }

      .editor-toolbar button:disabled {
        color: #aaa;
        cursor: default;
      }

      .editor-toolbar .sep {
        width: 1px;
        height: 1.4rem;
        background: #ddd;
        margin: 0 0.2rem;
      }

      .editor-toolbar .spacer {
        flex: 1;
      }

      #editorInfo {
        font-size: 0.85rem;
        color: #666;
      }

      .editor-toolbar #saveAsBtn {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
      }

      .editor-toolbar #saveAsBtn:hover:not(:disabled) {
        background: #019170;
        color: white;
      }

      #editorGrid {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        align-content: start;
        padding: 1rem;
        user-select: none;
        touch-action: none;
      }

      .page-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        padding: 0.5rem;
        border: 2px solid transparent;
        border-radius: 8px;
        cursor: grab;
      }

      .page-card:hover {
        background: #e9e9e9;
      }

      .page-card.selected {
        border-color: var(--primary);
        background: #dff5ef;
      }

      .page-card .thumb {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
      }

      .page-card img {
        position: absolute;
        inset: 0;
        margin: auto;
        max-width: 100%;
        max-height: 100%;
        background: white;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        transition: transform 0.2s;
      }

      .page-card img:not([src]) {
        width: 70%;
        height: 90%;
      }

      .page-card span {
        font-size: 0.85rem;
        color: #555;
      }

      .dragging-pages .page-card {
        cursor: grabbing;
      }

      .dragging-pages .page-card.selected {
        opacity: 0.45;
      }

      .page-card.drop-before::before,
      .page-card.drop-after::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        width: 4px;
        border-radius: 2px;
        background: var(--primary);
      }

      .page-card.drop-before::before {
        left: -0.6rem;
      }

      .page-card.drop-after::after {
        right: -0.6rem;
      }

      #pageMenu {
        position: fixed;
        z-index: 10;
        min-width: 190px;
        padding: 0.3rem 0;
        background: white;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        font-size: 0.9rem;
      }

      #pageMenu[hidden] {
        display: none;
      }

      #pageMenu [data-count] {
        padding: 0.3rem 0.9rem;
        font-size: 0.8rem;
        color: #888;
      }

      #pageMenu button {
        display: block;
        width: 100%;
        padding: 0.4rem 0.9rem;
        border: none;
        background: none;
        font: inherit;
        color: var(--text);
        text-align: left;
        cursor: pointer;
      }

      #pageMenu button:hover {
        background: #dff5ef;
        color: #019170;
      }

      #pageMenu hr {
        margin: 0.3rem 0;
        border: none;
        border-top: 1px solid #eee;
      }
    </style>
  </head>

  <body>
    <header>
      <button id="uploadBtn">열기</button>
      <button id="printBtn" class="ghost" disabled>인쇄</button>
      <button id="exportBtn" class="ghost" disabled>MD 내보내기</button>
      <button id="editBtn" class="ghost" disabled>페이지 편집</button>
      <button id="mergeBtn" class="ghost">PDF 병합</button>
    </header>

    <main>
      <iframe id="viewer" style="display: none"></iframe>

      <section id="editor" hidden>
        <div class="editor-toolbar">
          <button id="rotLeftBtn" title="왼쪽으로 90° 회전">↺ 회전</button>
          <button id="rotRightBtn" title="오른쪽으로 90° 회전">↻ 회전</button>
          <button id="deleteBtn" title="선택한 페이지 삭제 (Delete)">삭제</button>
          <span class="sep"></span>
          <button id="insertBtn" title="다른 PDF의 페이지를 선택한 페이지 뒤에 끼워넣기">PDF 끼워넣기</button>
          <button id="extractBtn" title="선택한 페이지만 새 PDF로 저장">선택 추출</button>
          <span class="spacer"></span>
          <span id="editorInfo"></span>
          <button id="saveAsBtn">다른 이름으로 저장</button>
          <button id="closeEditorBtn">닫기</button>
        </div>
        <div id="editorGrid"></div>
        <div id="pageMenu" hidden>
          <div data-count></div>
          <button data-action="rotate-left">↺ 왼쪽으로 회전</button>
          <button data-action="rotate-right">↻ 오른쪽으로 회전</button>
          <button data-action="delete">삭제</button>
          <hr />
          <button data-action="insert-before">앞에 PDF 끼워넣기</button>
          <button data-action="insert-after">뒤에 PDF 끼워넣기</button>
          <hr />
          <button data-action="extract">선택 페이지 추출</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
